<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="/vibe/css/main.css">
  <title>VIBE - Calculate BMI</title>
</head>
<body>
<h1>VIBE</h1>

<p>
  Calculate your BMI!
</p>

<hr>

<nav>
  <ul>
    <li><a href="/vibe/">Home</a></li>
    <li><a href="#" onclick="return false;">Calculate BMI</a></li>
    <li><a href="/vibe/bmi-statistics.html">BMI Statistics</a></li>
    <li><a href="/vibe/bmi-category.html">BMI Categories</a></li>
  </ul>
</nav>

<hr>

<main>
  <h2>Calculate Your BMI</h2>
  <form id="bmi-form">
    <div>
      <label for="height">Height (cm):</label>
      <input type="number" id="height" name="height" step="any" min="1" required placeholder="e.g. 175">
    </div>
    <div>
      <label for="weight">Weight (kg):</label>
      <input type="number" id="weight" name="weight" step="any" min="1" required placeholder="e.g. 70">
    </div>
    <button type="submit" id="calculate-btn">Calculate BMI</button>
  </form>

  <div id="result" aria-live="polite"></div>
</main>

<script src="/vibe/js/bmi-calc.js"></script>
</body>
</html>
