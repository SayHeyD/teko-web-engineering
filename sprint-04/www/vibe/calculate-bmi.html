<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/vibe/css/main.css">
  <script src="/vibe/js/menu.js" defer></script>
  <script src="/vibe/js/calculate-bmi.js" defer></script>
  <title>VIBE - Calculate BMI</title>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm">
  <div class="container">
    <a class="navbar-brand vibe-brand" href="/vibe/">VIBE</a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav navlinks">
        <!-- Populated by JS -->
      </ul>
    </div>
  </div>
</nav>

<main class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card card-social border-0 shadow-sm">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <h2 class="fw-bold text-primary mb-2">Calculate Your BMI</h2>
            <p class="text-muted">Enter your body measurements below to check your Body Mass Index.</p>
          </div>

          <form id="bmi-form" novalidate>
            <div class="mb-3">
              <label for="height" class="form-label fw-semibold">Height (cm)</label>
              <div class="input-group">
                <input type="number" class="form-control form-control-lg" id="height" name="height" step="any" min="1" required placeholder="e.g. 175">
                <span class="input-group-text bg-light text-muted">cm</span>
              </div>
            </div>

            <div class="mb-4">
              <label for="weight" class="form-label fw-semibold">Weight (kg)</label>
              <div class="input-group">
                <input type="number" class="form-control form-control-lg" id="weight" name="weight" step="any" min="1" required placeholder="e.g. 70">
                <span class="input-group-text bg-light text-muted">kg</span>
              </div>
            </div>

            <button type="submit" class="btn btn-vibe btn-lg w-100 shadow-sm" id="calculate-btn">Calculate BMI</button>
          </form>

          <div id="result" aria-live="polite"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
