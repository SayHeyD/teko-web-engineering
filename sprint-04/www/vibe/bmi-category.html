<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/vibe/css/main.css">
  <script src="/vibe/js/menu.js" defer></script>
  <script src="/vibe/js/api.js" defer></script>
  <script src="/vibe/js/bmi-category.js" defer></script>
  <title>VIBE - BMI Categories</title>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm">
  <div class="container">
    <a class="navbar-brand vibe-brand" href="/vibe/">VIBE</a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav navlinks">
        <!-- Populated by JS -->
      </ul>
    </div>
  </div>
</nav>

<main class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-10 col-xl-8">
      <div class="card card-social shadow-sm border-0 mb-4">
        <div class="card-body p-4">
          <h2 class="card-title text-primary fw-bold mb-2">BMI Categories</h2>
          <p class="card-text text-muted">Overview of the standard World Health Organization BMI categories and classifications. 💪🏼</p>
        </div>
      </div>

      <div class="card card-social shadow-sm border-0 overflow-hidden">
        <div class="table-responsive">
          <table id="bmi-category-table" class="table table-bordered table-hover table-striped align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th colspan="2" class="text-center">Category</th>
                <th colspan="2" class="text-center">Values</th>
              </tr>
              <tr class="table-secondary">
                <th class="ps-3">general</th>
                <th>specific</th>
                <th class="text-center">minimal</th>
                <th class="text-center">maximal</th>
              </tr>
            </thead>
          </table>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
