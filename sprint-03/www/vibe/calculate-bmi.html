<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="/vibe/css/main.css">
  <script src="/vibe/js/menu.js" defer></script>
  <script src="/vibe/js/calculate-bmi.js" defer></script>
  <title>VIBE - Calculate BMI</title>
</head>
<body>
<nav class="navbar">
  <h1><a href="/vibe/">VIBE</a></h1>

  <ul class="navlinks">
    <!-- Populated by JS -->
  </ul>
</nav>

<main class="page-content">
  <section>
  <h2>Calculate Your BMI</h2>
  <p>Calculate your BMI!</p>
  <form class="bmi-form" id="bmi-form">
    <div>
      <label for="height">Height (cm):</label>
      <input type="number" id="height" name="height" step="any" min="1" required placeholder="e.g. 175">
    </div>
    <div>
      <label for="weight">Weight (kg):</label>
      <input type="number" id="weight" name="weight" step="any" min="1" required placeholder="e.g. 70">
    </div>
    <button type="submit" id="calculate-btn">Calculate BMI</button>
  </form>

  <div id="result" aria-live="polite"></div>
  </section>
</main>
</body>
</html>
